# Search test cases. kind:
#   exists:       a module does this in `version`; `expected` lists modules that count as a hit
#   other_version: no module in `version`, but one in another version (`expected`); a good
#                 answer says no for this version and points to the other version / migration
#   absent:       no OCA module does this in any version (checked against the full index by
#                 keyword and embedding search); `partial` lists acceptable "close but not it"
# Versions and absences checked against the 2026-10-15 sync.

